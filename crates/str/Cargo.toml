[package]
name = "itym_str"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"

description = "Fixed-capacity and fixed-length strings supporting const mutation."
categories = ["no-std::no-alloc", "data-structures", "memory-management", "rust-patterns"]
keywords = ["arraystr", "arraystring"]

license.workspace = true
repository.workspace = true

[dependencies]
itym_assert = { path = "../assert", version = "0.1.2", features = ["shorting"] }
itym_slot = { path = "../slot", version = "0.1.2" }

borsh = { workspace = true, features = [], optional = true }
serde = { workspace = true, features = [], optional = true }

[features]
default = []
alloc = ["itym_slot/alloc"]
std = ["alloc", "itym_slot/std"]

borsh = ["dep:borsh", "itym_slot/borsh"]
serde = ["dep:serde", "itym_slot/serde"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "vs_alloc"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
	"-Zunstable-options",
	"--generate-link-to-definition",
	"--generate-macro-expansion",
]
